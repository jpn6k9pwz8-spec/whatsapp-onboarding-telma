<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Integração WhatsApp Business - Consultório Dra. Telma</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f7f9;
      margin: 0;
      padding: 40px 20px;
      text-align: center;
    }

    .container {
      max-width: 600px;
      margin: 60px auto;
      background: white;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08);
    }

    h2 {
      margin-bottom: 20px;
    }

    p {
      line-height: 1.6;
      color: #444;
    }

    button {
      margin-top: 20px;
      background: #1877f2;
      color: white;
      border: 0;
      border-radius: 7px;
      padding: 14px 26px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    #status {
      margin-top: 25px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="container">

    <h2>Integração WhatsApp Business</h2>

    <p>
      Conectar o WhatsApp Business do Consultório Dra. Telma
      à Plataforma do WhatsApp Business.
    </p>

    <p>
      Esta integração permite utilizar o WhatsApp Business
      juntamente com os recursos da API.
    </p>

    <button onclick="launchWhatsAppSignup()">
      Conectar WhatsApp Business
    </button>

    <div id="status"></div>

  </div>

  <script>
    window.fbAsyncInit = function () {
      FB.init({
        appId: '1665306038546848',
        autoLogAppEvents: true,
        xfbml: true,
        version: 'v26.0'
      });
    };

    (function (d, s, id) {
      var js;
      var fjs = d.getElementsByTagName(s)[0];

      if (d.getElementById(id)) {
        return;
      }

      js = d.createElement(s);
      js.id = id;
      js.src = 'https://connect.facebook.net/en_US/sdk.js';

      fjs.parentNode.insertBefore(js, fjs);

    }(document, 'script', 'facebook-jssdk'));


    window.addEventListener('message', function (event) {

      if (
        event.origin !== 'https://www.facebook.com' &&
        event.origin !== 'https://web.facebook.com'
      ) {
        return;
      }

      try {

        var data =
          typeof event.data === 'string'
            ? JSON.parse(event.data)
            : event.data;

        if (data && data.type === 'WA_EMBEDDED_SIGNUP') {

          console.log(
            'WhatsApp Embedded Signup:',
            data
          );

        }

      } catch (e) {

        console.log('Evento ignorado.');

      }

    });


    function fbLoginCallback(response) {

      if (response.authResponse) {

        const code = response.authResponse.code;

        console.log(
          'Código de autorização recebido.'
        );

        document.getElementById('status').innerText =
          'Autorização concluída. Não feche esta página.';

      } else {

        document.getElementById('status').innerText =
          'Integração não concluída.';

      }

    }


    function launchWhatsAppSignup() {

      document.getElementById('status').innerText =
        'Abrindo integração do WhatsApp...';

      FB.login(
        fbLoginCallback,
        {
          config_id: '1427514582858915',

          response_type: 'code',

          override_default_response_type: true,

          extras: {
            version: 'v4',
            featureType: 'whatsapp_business_app_onboarding',
            features: [
              {
                name: 'app_only_install'
              }
            ]
          }
        }
      );

    }
  </script>

</body>
</html>
